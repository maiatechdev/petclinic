# Connection and JPA settings for MySQL.
#
# Selected with -Dpetclinic.db=mysql (or the environment variable PETCLINIC_DB=mysql).
# Credentials are NOT stored in the repository. Provide them at start-up:
#   PETCLINIC_DB_URL       (optional, default below)
#   PETCLINIC_DB_USERNAME  (optional, default below)
#   PETCLINIC_DB_PASSWORD  (required: the application refuses to start without it)
# The same names also work as -D system properties.

jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=${PETCLINIC_DB_URL:jdbc:mysql://localhost:3306/petclinic}
jdbc.username=${PETCLINIC_DB_USERNAME:petclinic}
jdbc.password=${PETCLINIC_DB_PASSWORD}

# Properties that control the population of schema and data for a new data source
jdbc.initLocation=classpath:db/mysql/initDB.sql
jdbc.dataLocation=classpath:db/mysql/populateDB.sql

# Property that determines which database to use with an AbstractJpaVendorAdapter
jpa.database=MYSQL

jpa.showSql=false
