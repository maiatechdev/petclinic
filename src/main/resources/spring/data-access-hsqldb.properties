# Connection and JPA settings for the default database (HSQLDB, in memory).
#
# Loaded by <context:property-placeholder> in datasource-config.xml and business-config.xml.
# The file is chosen by the "petclinic.db" setting (default: hsqldb). To switch database
# without editing any XML, start the application with -Dpetclinic.db=mysql
# or with the environment variable PETCLINIC_DB=mysql.

jdbc.driverClassName=org.hsqldb.jdbcDriver
jdbc.url=jdbc:hsqldb:mem:petclinic
jdbc.username=sa
jdbc.password=

# Properties that control the population of schema and data for a new data source
jdbc.initLocation=classpath:db/hsqldb/initDB.sql
jdbc.dataLocation=classpath:db/hsqldb/populateDB.sql

# Property that determines which database to use with an AbstractJpaVendorAdapter
jpa.database=HSQL

jpa.showSql=true
